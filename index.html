<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where my clovers have gone 🍀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    --cream: #FBF9F2;
    --ink: #23301F;
    --ink-soft: #55604C;
    --clover: #1E7A3D;
    --clover-deep: #24513A;
    --clover-pale: #E4EEE0;
    --line: #DED8C4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; touch-action: manipulation; background: #1b2a20; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }

  /* 9:16 stage, as large as the window allows */
  .stage {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, 56.25vh);
    height: min(100vh, 177.78vw);
    width: min(100vw, 56.25dvh);
    height: min(100dvh, 177.78vw);
    overflow: hidden;
    background: #EEF1E6;
    font-size: min(1.6vh, 2.85vw);
  }
  #map { position: absolute; inset: 0; background: #EEF1E6; }
  #map .leaflet-tile-pane { filter: sepia(0.35) saturate(1.3) hue-rotate(45deg) brightness(1.02); }
  .leaflet-control-attribution { font-size: 8px; opacity: .6; }

  /* header */
  .head {
    position: absolute; left: 0; right: 0; top: 0;
    padding: 9% 7% 12%;
    text-align: center;
    background: linear-gradient(to bottom, rgba(251,249,242,.95) 0%, rgba(251,249,242,.85) 55%, rgba(251,249,242,0) 100%);
    z-index: 800;
    pointer-events: none;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: .5em;
    background: var(--clover-deep); color: #fff;
    font-weight: 700; font-size: 1.05em;
    padding: .5em 1.1em .5em .8em; border-radius: 99px;
  }
  .eyebrow svg { width: 1.2em; height: 1.2em; }
  .count {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 5.6em; line-height: 1; color: var(--clover-deep);
    margin-top: .18em; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    display: inline-block;
  }
  .count.bump { animation: bump .18s ease-out; }
  @keyframes bump { 0% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .count-lbl { font-size: 1.25em; font-weight: 600; color: var(--ink-soft); margin-top: .2em; }
  .chips { display: flex; justify-content: center; gap: .6em; margin-top: .8em; }
  .chip {
    background: #fff; border: 1px solid var(--line); border-radius: 99px;
    padding: .35em .9em; font-weight: 700; font-size: 1.05em; color: var(--clover-deep);
    box-shadow: 0 .3em .9em -.4em rgba(35,48,31,.3);
    font-variant-numeric: tabular-nums;
  }

  /* clover pins */
  .cpin { background: none; border: none; }
  .cpin-in { position: relative; width: 100%; height: 100%; }
  .cpin-in svg { position: relative; width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 2px rgba(35,48,31,.35)); }
  .cpin-in.drop svg { animation: drop .55s cubic-bezier(.2,1.7,.45,1) both; }
  .cpin-in .ring {
    position: absolute; left: 50%; top: 50%;
    width: 260%; height: 260%; margin: -130% 0 0 -130%;
    border-radius: 50%; border: 2px solid var(--clover);
    animation: ring .75s ease-out forwards; pointer-events: none;
  }
  @keyframes drop {
    0% { transform: scale(0) rotate(-45deg); opacity: 0; }
    55% { transform: scale(1.35) rotate(10deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes ring { 0% { transform: scale(.15); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }

  /* city cards */
  .card {
    position: absolute; z-index: 900;
    display: flex; align-items: center; gap: .7em;
    background: #fff; border-radius: 1em;
    padding: .7em 1.1em .7em .75em;
    box-shadow: 0 1.2em 2.4em -1em rgba(35,48,31,.45), 0 0 0 1px rgba(222,216,196,.7);
    max-width: 62%;
    pointer-events: none;
  }
  .card.left { left: 4%; animation: inL .45s cubic-bezier(.2,1.4,.4,1) both, out .4s ease-in forwards var(--life); }
  .card.right { right: 4%; animation: inR .45s cubic-bezier(.2,1.4,.4,1) both, out .4s ease-in forwards var(--life); }
  .card .ic {
    flex-shrink: 0; width: 2.4em; height: 2.4em; border-radius: 50%;
    background: var(--clover-pale); display: flex; align-items: center; justify-content: center;
  }
  .card .ic svg { width: 1.7em; height: 1.7em; }
  .card .city { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.5em; color: var(--ink); line-height: 1.1; white-space: nowrap; }
  .card .where { font-size: 1em; font-weight: 600; color: var(--ink-soft); margin-top: .15em; white-space: nowrap; }
  .card.big { padding: 1em 1.5em 1em 1em; border-radius: 1.3em; }
  .card.big .ic { width: 3.2em; height: 3.2em; }
  .card.big .ic svg { width: 2.3em; height: 2.3em; }
  .card.big .city { font-size: 2.3em; }
  .card.big .where { font-size: 1.3em; }
  @keyframes inL { from { transform: translateX(-130%) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes inR { from { transform: translateX(130%) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes out { to { transform: translateY(-40%) scale(.9); opacity: 0; } }

  /* finale */
  .finale {
    position: absolute; left: 6%; right: 6%; top: 58%;
    z-index: 950; text-align: center;
    background: var(--clover-deep); color: #fff;
    border-radius: 1.4em; padding: 1.3em 1em 1.2em;
    box-shadow: 0 1.6em 3em -1.2em rgba(0,0,0,.5);
    opacity: 0; transform: translateY(30%) scale(.85);
    pointer-events: none;
  }
  .finale.show { animation: finIn .7s cubic-bezier(.2,1.5,.4,1) forwards; }
  @keyframes finIn { to { opacity: 1; transform: none; } }
  .finale .big { font-family: 'Fraunces', serif; font-weight: 600; font-size: 2.6em; line-height: 1.1; }
  .finale .small { font-size: 1.2em; font-weight: 600; color: #CFE0D2; margin-top: .4em; }

  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 940; pointer-events: none; }
  .flash.go { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }

  /* controls: pinned to the window corner, outside what you'll keep */
  .controls {
    position: fixed; top: 10px; left: 10px; z-index: 2000;
    display: flex; gap: 6px; align-items: center;
    font-family: 'Inter', sans-serif;
  }
  .controls button, .controls select {
    font: 600 12px 'Inter', sans-serif;
    background: rgba(20,32,24,.85); color: #fff;
    border: 1px solid rgba(255,255,255,.25); border-radius: 8px;
    padding: 7px 11px; cursor: pointer;
  }
  .controls button:hover { background: #24513A; }
  .controls button:disabled { opacity: .45; cursor: default; }
  .controls .tip { color: rgba(255,255,255,.55); font-size: 11px; margin-left: 4px; }
  .controls { flex-wrap: wrap; max-width: calc(100vw - 20px); transition: opacity .25s; }
  body.hide-ui .controls, body.running .controls { opacity: 0; pointer-events: none; }
</style>
</head>

function pinSize(n, z) {
  const scale = Math.max(0.5, Math.min(1, 0.5 + 0.22 * (z - 2.2)));
  return Math.round(Math.min(58, 30 + 7 * Math.sqrt(n - 1)) * scale);
}
function pinIcon(n, z, animate) {
  const s = pinSize(n, z);
  return L.divIcon({
    className: 'cpin',
    html: '<div class="cpin-in' + (animate ? ' drop' : '') + '">' + (animate ? '<span class="ring"></span>' : '') + CLOVER_SVG + '</div>',
    iconSize: [s, s], iconAnchor: [s / 2, s / 2]
  });
}

// --------- sound (synthesised, no files) ---------
let actx = null, master = null, soundOn = true, lastPop = 0;
function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 6;
    master = actx.createGain(); master.gain.value = 0.9;
    master.connect(comp); comp.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760, 2093];
function pop(freq, vol = 0.5) {
  if (!soundOn || !actx) return;
  const now = performance.now();
  if (now - lastPop < 28) return;        // keep the flood crisp, not a buzz
  lastPop = now;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq * 0.55, t);
  o.frequency.exponentialRampToValueAtTime(freq * 1.25, t + 0.045);
  o.frequency.exponentialRampToValueAtTime(freq, t + 0.11);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.18);
  const o2 = actx.createOscillator(), g2 = actx.createGain();   // sparkle on top
  o2.type = 'triangle'; o2.frequency.setValueAtTime(freq * 2, t);
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(vol * 0.18, t + 0.005);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  o2.connect(g2); g2.connect(master); o2.start(t); o2.stop(t + 0.1);
}
function whoosh(dur = 1.2) {
  if (!soundOn || !actx) return;
  const t = actx.currentTime, len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(1800, t + dur * 0.5); f.frequency.exponentialRampToValueAtTime(400, t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + dur * 0.45); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur);
}
function chime() {
  if (!soundOn || !actx) return;
  const t = actx.currentTime;
  [523.25, 659.25, 783.99, 1046.5, 1567.98].forEach((fr, k) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = k % 2 ? 'triangle' : 'sine'; o.frequency.value = fr;
    const s = t + k * 0.07;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(0.28, s + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, s + 1.6);
    o.connect(g); g.connect(master); o.start(s); o.stop(s + 1.7);
  });
}

  placed.push({ marker: m, n: p[5] });
  clovers += p[5]; towns++; countrySet.add(p[2]);
  renderCounts();
  if (opts.note) pop(opts.note, opts.vol);
  if (opts.card) showCard(p, opts.card === 'big', opts.life || 1800);
}

function flyTo(latlng, zoom, seconds, id) {
  return new Promise(res => {
    if (id !== runId) return res();
    map.once('moveend', () => res());
    map.flyTo(latlng, zoom, { duration: seconds / pace, easeLinearity: 0.2 });
  });
}
function panTo(latlng, seconds, id) {
  return new Promise(res => {
    if (id !== runId) return res();
    map.once('moveend', () => res());
    map.panTo(latlng, { animate: true, duration: seconds / pace, easeLinearity: 0.9 });
  });
}
const wait = (ms, id) => sleep(ms / pace).then(() => { if (id !== runId) throw 'reset'; });

// --------- the show ---------
async function play() {
  if (!tilesReady) return;
  const id = ++runId;
  pace = SPEED;
  audio();
  $('playBtn').disabled = true;
  document.body.classList.add('running');
  try {
    await sleep(START_DELAY);
    if (id !== runId) throw 'reset';
    const tour = TOUR.map(([n, c]) => idx(n, c)), next = NEXT.map(([n, c]) => idx(n, c));
    const used = new Set([...tour, ...next]);
    const rest = PLACES.map((_, i) => i).filter(i => !used.has(i));
    for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }

    await wait(500, id);

    // 1. fly to a handful of far-flung places, one at a time
    for (let k = 0; k < tour.length; k++) {
      const p = PLACES[tour[k]];
      whoosh(1.4 / pace);
      await flyTo([p[3], p[4]], TOUR_ZOOM, 1.5, id);
      await wait(120, id);
      addPlace(tour[k], { note: SCALE[k * 2], vol: 0.55, card: 'big', life: 1300 / pace });
      await wait(1150, id);
    }

    // 2. pull back and name a few more, getting quicker
    whoosh(1.8 / pace);
    const w = wideView();
    await flyTo(w.center, w.zoom, 1.9, id);
    for (let k = 0; k < next.length; k++) {
      addPlace(next[k], { note: SCALE[Math.floor(Math.random() * 8)], vol: 0.45, card: 'small', life: 1500 / pace });
      await wait(Math.max(170, 800 * Math.pow(0.9, k)), id);
    }

    // 3. the flood: back to the original pace, faster and faster until everything is on the map
    pace = 1;
    await new Promise((resolve, reject) => {
      const times = []; let t = 0;
      for (let j = 0; j < rest.length; j++) { t += Math.max(6, 190 * Math.pow(0.962, j)) / pace; times.push(t); }
      const start = performance.now(); let j = 0;
      (function frame() {
        if (id !== runId) return reject('reset');
        const el = performance.now() - start;
        while (j < rest.length && times[j] <= el) {
          const prog = j / rest.length;
          const note = SCALE[Math.min(SCALE.length - 1, Math.floor(prog * 8 + Math.random() * 3))];
          addPlace(rest[j], { note, vol: 0.32 });
          j++;
        }
        if (j < rest.length) requestAnimationFrame(frame); else resolve();
      })();
    });

    // 4. finale: reveal the rest of the world
    await wait(450, id);
    chime();
    $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
    whoosh(1.4 / pace);
    await flyTo(FINALE.center, FINALE.zoom, 1.4, id);
    await wait(250, id);
    whoosh(4 / pace);
    await panTo(FINALE.panEast, 4.2, id);
    await wait(500, id);
    whoosh(2.2 / pace);
    await panTo(FINALE.panBack, 2.4, id);
    $('finale').classList.add('show');
    chime();
  } catch (e) { /* reset pressed mid-run */ }
  if (id === runId) $('playBtn').disabled = !tilesReady;
}

function reset() {
  runId++;
  document.body.classList.remove('running');
  map.stop();
  layer.clearLayers(); placed.length = 0;
  clovers = 0; towns = 0; countrySet.clear(); side = 0; slot = 0;
  renderCounts();
  document.querySelectorAll('.card').forEach(c => c.remove());
  $('finale').classList.remove('show');
  const w = wideView();
  map.setView(w.center, w.zoom, { animate: false });
  $('playBtn').disabled = !tilesReady;
}

// --------- preload every map tile the camera will pass over ---------
// Traces the exact fly/pan path (same maths Leaflet uses for flyTo) at this screen size,
// then downloads those tiles up front so nothing is blank while the camera swings around.
let tilesReady = false;
const tileKeysLoaded = new Set();
const tileImgs = [];            // hold references so the browser keeps them in memory
const TILE_LAYERS = ['World_Light_Gray_Base', 'World_Light_Gray_Reference'];

function addViewTiles(set, center, zoom) {
  const tz = Math.max(0, Math.min(16, Math.round(zoom)));
  const scale = Math.pow(2, zoom - tz);
  const size = map.getSize().divideBy(scale);
  const c = map.project(L.latLng(center), tz);
  const n = Math.pow(2, tz);
  const x0 = Math.floor((c.x - size.x / 2) / 256) - 1, x1 = Math.floor((c.x + size.x / 2) / 256) + 1;
  const y0 = Math.floor((c.y - size.y / 2) / 256) - 1, y1 = Math.floor((c.y + size.y / 2) / 256) + 1;
  for (let y = Math.max(0, y0); y <= Math.min(n - 1, y1); y++)
    for (let x = x0; x <= x1; x++) set.add(tz + '/' + y + '/' + (((x % n) + n) % n));
}
function addFlyTiles(set, fromC, fromZ, toC, toZ) {
  const size = map.getSize(), w0 = Math.max(size.x, size.y);
  const w1 = w0 * map.getZoomScale(fromZ, toZ);
  const from = map.project(L.latLng(fromC), fromZ), to = map.project(L.latLng(toC), fromZ);
  const u1 = to.distanceTo(from) || 1, rho = 1.42, rho2 = rho * rho;
  const sinh = n => (Math.exp(n) - Math.exp(-n)) / 2, cosh = n => (Math.exp(n) + Math.exp(-n)) / 2, tanh = n => sinh(n) / cosh(n);
  const r = i => {
    const s1 = i ? -1 : 1, s2 = i ? w1 : w0, t1 = w1 * w1 - w0 * w0 + s1 * rho2 * rho2 * u1 * u1;
    const b = t1 / (2 * s2 * rho2 * u1), sq = Math.sqrt(b * b + 1) - b;
    return sq < 1e-9 ? -18 : Math.log(sq);
  };
  const r0 = r(0), S = (r(1) - r0) / rho;
  const w = s => w0 * (cosh(r0) / cosh(r0 + rho * s));
  const u = s => w0 * (cosh(r0) * tanh(r0 + rho * s) - sinh(r0)) / rho2;
  const steps = 60;
  for (let k = 0; k <= steps; k++) {
    const sv = S * k / steps;
    const c = map.unproject(from.add(to.subtract(from).multiplyBy(u(sv) / u1)), fromZ);
    addViewTiles(set, c, map.getScaleZoom(w0 / w(sv), fromZ));
  }
  addViewTiles(set, toC, toZ);
}
function addPanTiles(set, fromC, toC, zoom) {
  const a = map.project(L.latLng(fromC), zoom), b = map.project(L.latLng(toC), zoom);
  for (let k = 0; k <= 40; k++) addViewTiles(set, map.unproject(a.add(b.subtract(a).multiplyBy(k / 40)), zoom), zoom);
}
function cameraTiles() {
  const set = new Set(), w = wideView();
  addViewTiles(set, w.center, w.zoom);
  let cur = { c: w.center, z: w.zoom };
  TOUR.forEach(([n, c]) => {
    const p = PLACES[idx(n, c)];
    addFlyTiles(set, cur.c, cur.z, [p[3], p[4]], TOUR_ZOOM);
    cur = { c: [p[3], p[4]], z: TOUR_ZOOM };
  });
  addFlyTiles(set, cur.c, cur.z, w.center, w.zoom);
  addFlyTiles(set, w.center, w.zoom, FINALE.center, FINALE.zoom);
  addPanTiles(set, FINALE.center, FINALE.panEast, FINALE.zoom);
  addPanTiles(set, FINALE.panEast, FINALE.panBack, FINALE.zoom);
  return set;
}
async function preloadTiles() {
  tilesReady = false;
  const btn = $('playBtn'); btn.disabled = true;
  const keys = [...cameraTiles()].filter(k => !tileKeysLoaded.has(k));
  const urls = [];
  keys.forEach(k => { const [z, y, x] = k.split('/'); TILE_LAYERS.forEach(l => urls.push([k, esri + l + '/MapServer/tile/' + z + '/' + y + '/' + x])); });
  let done = 0, next = 0;
  const total = urls.length;
  const label = () => { btn.textContent = total ? 'Loading map ' + Math.round(100 * done / total) + '%' : '▶ Play'; };
  label();
  await new Promise(resolve => {
    if (!total) return resolve();
    const worker = () => {
      if (next >= total) return;
      const [k, url] = urls[next++];
      const img = new Image();
      img.onload = img.onerror = () => {
        tileImgs.push(img); tileKeysLoaded.add(k);
        done++; label();
        if (done === total) resolve(); else worker();
      };
      img.src = url;
    };
    for (let i = 0; i < 8; i++) worker();
  });
  tilesReady = true;
  btn.textContent = '▶ Play';
  btn.disabled = false;
}
let preloadTimer = null;
function schedulePreload() { clearTimeout(preloadTimer); preloadTimer = setTimeout(preloadTiles, 300); }

// --------- controls ---------
$('playBtn').onclick = play;
$('resetBtn').onclick = reset;
$('speedSel').onchange = e => { SPEED = parseFloat(e.target.value); };
$('soundBtn').onclick = () => { soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off'; };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); if (!$('playBtn').disabled) play(); }
  if (e.key === 'r' || e.key === 'R') reset();
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hide-ui');
  if (e.key === 'Escape') showControls();
});
function showControls() { document.body.classList.remove('running', 'hide-ui'); }
document.addEventListener('dblclick', showControls);
let lastTap = 0;
document.addEventListener('touchend', e => {
  if (e.touches.length) return;
  const now = Date.now();
  if (now - lastTap < 320) { showControls(); lastTap = 0; } else lastTap = now;
}, { passive: true });
const fsEl = document.documentElement;
if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) $('fsBtn').style.display = 'none';
$('fsBtn').onclick = () => {
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
};
document.addEventListener('fullscreenchange', () => setTimeout(() => { map.invalidateSize(); if (!placed.length) { reset(); schedulePreload(); } }, 100));
window.addEventListener('resize', () => { map.invalidateSize(); if (!placed.length) { reset(); schedulePreload(); } });

reset();
preloadTiles();
</script>
</body>
</html>
